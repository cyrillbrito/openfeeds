# Local infrastructure only — the app runs on the host under Bun. One compose
# file: the self-host image gets added here behind a profile rather than
# forked into a compose.prod.yml that drifts.
#
# A second checkout already gets its own Postgres (Compose namespaces by
# directory name); only the published port collides, hence the variable:
#
#     echo 'POSTGRES_PORT=5433' > .env          # repo root
#     cd apps/web && bun run dev --port 3001    # with DATABASE_URL on :5433
services:
  postgres:
    image: postgres:18-alpine
    # Matching the DATABASE_URL default in env.ts is what makes a fresh clone
    # work with no .env edit. A deployment supplies real credentials.
    environment:
      POSTGRES_USER: openfeeds
      POSTGRES_PASSWORD: openfeeds
      POSTGRES_DB: openfeeds
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    # Mounted at /var/lib/postgresql, not .../data: the 18+ images store
    # data in a major-version subdirectory and refuse to start when the
    # old .../data path is the mount point. docker-library/postgres#1259.
    volumes:
      - pgdata:/var/lib/postgresql
    # Without this, `docker compose up -d && bun run dev` races: the container
    # is "up" seconds before Postgres accepts connections, and the boot
    # migration is what loses.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openfeeds -d openfeeds']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
